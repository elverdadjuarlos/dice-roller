<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Arkham Dice Roller</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#111111"
    >
</head>

<body>


<!-- =====================================================
     INVESTIGATOR SELECTION SCREEN
===================================================== -->

<section
    id="selection-screen"
    class="selection-screen"
>

    <div class="selection-content">

        <div class="selection-heading">

            <span class="selection-eyebrow">
                Arkham Companion
            </span>

            <h1>
                Choose Your Investigator
            </h1>

        </div>


        <div
            id="investigator-list"
            class="investigator-list"
        >

            <div class="selection-loading">
                Loading investigators...
            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     INVESTIGATOR GAME SCREEN
===================================================== -->

<main
    id="game-screen"
    class="app game-screen hidden"
>


    <!-- HEADER -->

    <header class="investigator-header">

        <div class="investigator-title-group">

            <h1 id="investigator-name">
                Investigator
            </h1>

            <button
                id="change-investigator"
                class="change-investigator-icon"
                aria-label="Change Investigator"
                title="Change Investigator"
            >
                ⇄
            </button>

        </div>


        <button
            id="manual-roll-open"
            class="header-button manual-roll-icon"
            aria-label="Manual Roll"
            title="Manual Roll"
        >
            ⚄
        </button>

    </header>


    <!-- =====================================================
         MAIN DASHBOARD
    ===================================================== -->

    <section class="investigator-dashboard">


        <!-- LEFT SIDE -->

        <div class="investigator-controls">


            <!-- HEALTH / SANITY -->

            <div class="vitals">


                <!-- HEALTH -->

                <div class="vital">

                    <span class="small-label">
                        Health
                    </span>


                    <div class="vital-value">

                        <span id="health-current">
                            —
                        </span>

                        <span class="vital-divider">
                            /
                        </span>

                        <span id="health-max">
                            —
                        </span>

                    </div>


                    <div class="mini-counter">

                        <button
                            id="health-minus"
                            aria-label="Decrease Health"
                        >
                            −
                        </button>

                        <button
                            id="health-plus"
                            aria-label="Increase Health"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- SANITY -->

                <div class="vital">

                    <span class="small-label">
                        Sanity
                    </span>


                    <div class="vital-value">

                        <span id="sanity-current">
                            —
                        </span>

                        <span class="vital-divider">
                            /
                        </span>

                        <span id="sanity-max">
                            —
                        </span>

                    </div>


                    <div class="mini-counter">

                        <button
                            id="sanity-minus"
                            aria-label="Decrease Sanity"
                        >
                            −
                        </button>

                        <button
                            id="sanity-plus"
                            aria-label="Increase Sanity"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>


            <!-- STATS -->

            <div
                id="investigator-stats"
                class="investigator-stats"
            >
            </div>


            <!-- TEST MODIFIER -->

            <div class="compact-counter-row">

                <span class="compact-counter-label">
                    Test Mod
                </span>

                <button
                    id="modifier-minus"
                    aria-label="Decrease Test Modifier"
                >
                    −
                </button>

                <span
                    id="test-modifier-value"
                    class="compact-counter-value"
                >
                    0
                </span>

                <button
                    id="modifier-plus"
                    aria-label="Increase Test Modifier"
                >
                    +
                </button>

            </div>


            <!-- INVENTORY -->

            <button
                id="inventory-open"
                class="inventory-open-button"
            >
                Inventory
            </button>

        </div>


        <!-- =================================================
             RIGHT SIDE
        ================================================= -->

        <div class="investigator-roll-panel">


            <!-- BLESSED / CURSED -->

            <div class="investigator-modifiers">

                <button id="blessed-button">
                    Blessed
                </button>

                <button id="cursed-button">
                    Cursed
                </button>

            </div>


            <!-- DICE AREA -->

            <div
                id="investigator-roll-area"
                class="investigator-roll-area"
            >

                <div
                    id="investigator-dice-results"
                    class="investigator-dice-results"
                >
                </div>


                <div class="investigator-result-footer">

                    <div class="investigator-total">

                        <span id="investigator-successes">
                            —
                        </span>

                        <span class="success-label">
                            Successes
                        </span>

                    </div>


                    <button
                        id="focus-reroll-button"
                        class="focus-reroll-button"
                    >
                        Reroll One Die
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         FUTURE CARDS / ITEMS AREA
    ===================================================== -->

    <section class="card-area">

        <div class="card-area-placeholder">

            <span>
                Investigator Cards &amp; Items
            </span>

        </div>

    </section>


    <!-- =====================================================
         MANUAL ROLL PANEL
    ===================================================== -->

    <div
        id="manual-roll-panel"
        class="overlay-panel"
    >

        <div class="overlay-content manual-roll-content">


            <div class="overlay-header">

                <h2>
                    Manual Roll
                </h2>

                <button id="manual-roll-close">
                    Close
                </button>

            </div>


            <span class="small-label">
                Number of Dice
            </span>


            <div
                id="dice-count"
                class="manual-dice-count"
            >

                <button
                    data-count="1"
                    class="selected"
                >
                    1
                </button>

                <button data-count="2">
                    2
                </button>

                <button data-count="3">
                    3
                </button>

                <button data-count="4">
                    4
                </button>

                <button data-count="5">
                    5
                </button>

                <button data-count="6">
                    6
                </button>

                <button data-count="7">
                    7
                </button>

                <button data-count="8">
                    8
                </button>

            </div>


            <div class="manual-status">

                Current status:

                <strong id="manual-status-text">
                    Normal
                </strong>

            </div>


            <button
                id="manual-roll-button"
                class="manual-roll-button"
            >
                Roll
            </button>


            <div
                id="manual-roll-area"
                class="manual-result-area"
            >

                <div
                    id="manual-dice-results"
                    class="manual-dice-results"
                >
                </div>


                <div class="manual-total">

                    <span id="manual-successes">
                        —
                    </span>

                    <span>
                        Successes
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         INVENTORY PANEL
    ===================================================== -->

    <div
        id="inventory-panel"
        class="overlay-panel"
    >

        <div class="overlay-content inventory-content">


            <div class="overlay-header">

                <h2>
                    Inventory
                </h2>

                <button id="inventory-close">
                    Close
                </button>

            </div>


            <div class="inventory-grid">


                <!-- MONEY -->

                <div class="inventory-item">

                    <span class="inventory-label">
                        Money
                    </span>

                    <span
                        id="money-value"
                        class="inventory-value"
                    >
                        0
                    </span>

                    <div class="inventory-buttons">

                        <button
                            id="money-minus"
                            aria-label="Decrease Money"
                        >
                            −
                        </button>

                        <button
                            id="money-plus"
                            aria-label="Increase Money"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- REMNANTS -->

                <div class="inventory-item">

                    <span class="inventory-label">
                        Remnants
                    </span>

                    <span
                        id="remnants-value"
                        class="inventory-value"
                    >
                        0
                    </span>

                    <div class="inventory-buttons">

                        <button
                            id="remnants-minus"
                            aria-label="Decrease Remnants"
                        >
                            −
                        </button>

                        <button
                            id="remnants-plus"
                            aria-label="Increase Remnants"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- CLUES -->

                <div class="inventory-item">

                    <span class="inventory-label">
                        Clues
                    </span>

                    <span
                        id="clues-value"
                        class="inventory-value"
                    >
                        0
                    </span>

                    <div class="inventory-buttons">

                        <button
                            id="clues-minus"
                            aria-label="Decrease Clues"
                        >
                            −
                        </button>

                        <button
                            id="clues-plus"
                            aria-label="Increase Clues"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
