<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Arkham Dice Roller</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#111111"
    >
</head>

<body>

<main class="app">

    <!-- HEADER -->

    <header class="investigator-header">

        <h1 id="investigator-name">
            Select Investigator
        </h1>

        <div class="header-actions">

            <button
                id="manual-roll-open"
                class="header-button"
            >
                Manual Roll
            </button>

            <button
                id="change-investigator"
                class="header-button"
            >
                Change
            </button>

        </div>

    </header>


    <!-- INVESTIGATOR SELECTOR -->

    <div
        id="investigator-selector"
        class="investigator-selector"
    >

        <select id="investigator-select">

            <option value="">
                Select Investigator
            </option>

        </select>

    </div>


    <!-- MAIN DASHBOARD -->

    <section class="investigator-dashboard">


        <!-- LEFT SIDE -->

        <div class="investigator-controls">


            <!-- HEALTH / SANITY -->

            <div class="vitals">

                <div class="vital">

                    <span class="small-label">
                        Health
                    </span>

                    <div class="vital-value">

                        <span id="health-current">
                            —
                        </span>

                        <span class="vital-divider">
                            /
                        </span>

                        <span id="health-max">
                            —
                        </span>

                    </div>

                    <div class="mini-counter">

                        <button id="health-minus">
                            −
                        </button>

                        <button id="health-plus">
                            +
                        </button>

                    </div>

                </div>


                <div class="vital">

                    <span class="small-label">
                        Sanity
                    </span>

                    <div class="vital-value">

                        <span id="sanity-current">
                            —
                        </span>

                        <span class="vital-divider">
                            /
                        </span>

                        <span id="sanity-max">
                            —
                        </span>

                    </div>

                    <div class="mini-counter">

                        <button id="sanity-minus">
                            −
                        </button>

                        <button id="sanity-plus">
                            +
                        </button>

                    </div>

                </div>

            </div>


            <!-- STATS + PER-STAT FOCUS -->

            <div
                id="investigator-stats"
                class="investigator-stats"
            >
            </div>


            <!-- TEST MODIFIER -->

            <div class="compact-counter-row">

                <span class="compact-counter-label">
                    Test Mod
                </span>

                <button id="modifier-minus">
                    −
                </button>

                <span
                    id="test-modifier-value"
                    class="compact-counter-value"
                >
                    0
                </span>

                <button id="modifier-plus">
                    +
                </button>

            </div>


            <!-- INVENTORY -->

            <button
                id="inventory-open"
                class="inventory-open-button"
            >
                Inventory
            </button>

        </div>


        <!-- RIGHT SIDE / MAIN DICE AREA -->

        <div class="investigator-roll-panel">


            <!-- BLESSED / CURSED -->

            <div class="investigator-modifiers">

                <button id="blessed-button">
                    Blessed
                </button>

                <button id="cursed-button">
                    Cursed
                </button>

            </div>


            <!-- DICE -->

            <div
                id="investigator-roll-area"
                class="investigator-roll-area"
            >

                <div
                    id="investigator-dice-results"
                    class="investigator-dice-results"
                >
                </div>


                <div class="investigator-result-footer">

                    <div class="investigator-total">

                        <span id="investigator-successes">
                            —
                        </span>

                        <span class="success-label">
                            Successes
                        </span>

                    </div>


                    <button
                        id="focus-reroll-button"
                        class="focus-reroll-button"
                    >
                        Reroll One Die
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- MANUAL ROLL PANEL -->

    <div
        id="manual-roll-panel"
        class="overlay-panel"
    >

        <div class="overlay-content manual-roll-content">

            <div class="overlay-header">

                <h2>
                    Manual Roll
                </h2>

                <button id="manual-roll-close">
                    Close
                </button>

            </div>


            <span class="small-label">
                Number of Dice
            </span>


            <div
                id="dice-count"
                class="manual-dice-count"
            >

                <button data-count="1" class="selected">1</button>
                <button data-count="2">2</button>
                <button data-count="3">3</button>
                <button data-count="4">4</button>
                <button data-count="5">5</button>
                <button data-count="6">6</button>
                <button data-count="7">7</button>
                <button data-count="8">8</button>

            </div>


            <div class="manual-status">

                Current status:

                <strong id="manual-status-text">
                    Normal
                </strong>

            </div>


            <button
                id="manual-roll-button"
                class="manual-roll-button"
            >
                Roll
            </button>


            <div
                id="manual-roll-area"
                class="manual-result-area"
            >

                <div
                    id="manual-dice-results"
                    class="manual-dice-results"
                >
                </div>


                <div class="manual-total">

                    <span id="manual-successes">
                        —
                    </span>

                    <span>
                        Successes
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- INVENTORY PANEL -->

    <div
        id="inventory-panel"
        class="overlay-panel"
    >

        <div class="overlay-content inventory-content">

            <div class="overlay-header">

                <h2>
                    Inventory
                </h2>

                <button id="inventory-close">
                    Close
                </button>

            </div>


            <div class="inventory-grid">


                <div class="inventory-item">

                    <span class="inventory-label">
                        Money
                    </span>

                    <span
                        id="money-value"
                        class="inventory-value"
                    >
                        0
                    </span>

                    <div class="inventory-buttons">

                        <button id="money-minus">
                            −
                        </button>

                        <button id="money-plus">
                            +
                        </button>

                    </div>

                </div>


                <div class="inventory-item">

                    <span class="inventory-label">
                        Remnants
                    </span>

                    <span
                        id="remnants-value"
                        class="inventory-value"
                    >
                        0
                    </span>

                    <div class="inventory-buttons">

                        <button id="remnants-minus">
                            −
                        </button>

                        <button id="remnants-plus">
                            +
                        </button>

                    </div>

                </div>


                <div class="inventory-item">

                    <span class="inventory-label">
                        Clues
                    </span>

                    <span
                        id="clues-value"
                        class="inventory-value"
                    >
                        0
                    </span>

                    <div class="inventory-buttons">

                        <button id="clues-minus">
                            −
                        </button>

                        <button id="clues-plus">
                            +
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
