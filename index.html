<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice Roller</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
</head>

<body>

    <main class="app">

        <!-- MODE TABS -->

        <div class="mode-tabs">

            <button
                id="manual-tab"
                class="mode-tab selected">
                Manual
            </button>

            <button
                id="investigator-tab"
                class="mode-tab">
                Investigator
            </button>

        </div>


        <!-- MANUAL MODE -->

        <section
            id="manual-mode"
            class="mode-content">

            <h2>Number of Dice</h2>

            <div
                class="button-group"
                id="dice-count">

                <button data-count="1" class="selected">1</button>
                <button data-count="2">2</button>
                <button data-count="3">3</button>
                <button data-count="4">4</button>
                <button data-count="5">5</button>
                <button data-count="6">6</button>
                <button data-count="7">7</button>
                <button data-count="8">8</button>

            </div>

        </section>


        <!-- INVESTIGATOR MODE -->

        <section
            id="investigator-mode"
            class="mode-content hidden">

            <h2>Investigator</h2>

            <select id="investigator-select">

                <option value="">
                    Select Investigator
                </option>

            </select>


            <div
                id="investigator-stats"
                class="investigator-stats">
            </div>

        </section>


        <!-- MODIFIERS -->

        <section>

            <h2>Modifiers</h2>

            <div class="button-group modifier-options">

                <button id="blessed-button">
                    Blessed
                </button>

                <button id="cursed-button">
                    Cursed
                </button>

            </div>

        </section>


        <!-- ROLL AREA -->

        <section
            id="roll-area"
            class="roll-area">

            <p class="tap-text">
                Tap here to roll
            </p>

            <div
                id="dice-results"
                class="dice-results">

                <div class="die-result pip-die"></div>

            </div>

            <div class="total">

                Successes

                <span id="successes">
                    —
                </span>

            </div>

        </section>


        <!-- MANUAL ROLL BUTTON -->

        <button
            id="roll-button"
            class="roll-button">

            ROLL

        </button>


        <!-- HISTORY -->

        <section class="history-section">

            <div class="history-header">

                <h2>History</h2>

                <button id="clear-history">
                    Clear
                </button>

            </div>

            <div id="history"></div>

            <button
                id="view-history"
                class="view-history">

                View All History

            </button>

        </section>


        <!-- FULL HISTORY PANEL -->

        <div
            id="history-panel"
            class="history-panel">

            <div class="history-panel-content">

                <div class="history-panel-header">

                    <h2>History</h2>

                    <button id="close-history">
                        Close
                    </button>

                </div>

                <div id="full-history"></div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
